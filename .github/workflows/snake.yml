name: Gerar cobrinha

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar animação a partir das contribuições
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#8b5cf6&color_dots=#e8e8f5,#c4b5fd,#a78bfa,#7c6cf0,#3b82f6
            dist/snake-dark.svg?palette=github-dark&color_snake=#8b5cf6&color_dots=#161630,#2f2a7a,#5b4bd6,#8b5cf6,#60a5fa

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
